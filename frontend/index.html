<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="ระบบจัดการสต๊อกอะไหล่รถยนต์ ใบเสร็จ ใบเสนอราคา และใบแจ้งซ่อม" />

    <!-- iOS Safari has no manifest/beforeinstallprompt support — these tags
         are what actually make "Add to Home Screen" use our icon and open
         without Safari's browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChamppowerSPK" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <title>ChamppowerSPK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- ถ้า URL นี้ไม่ใช่เส้นทางของแอปนี้เลย (เช่น /champ-power-landing.html หรือ /landing
         — หน้าโฆษณาที่ backend/public เสิร์ฟตรง ๆ แยกจาก SPA) แต่ index.html นี้ดันโหลด
         ขึ้นมาแทน แปลว่า service worker เก่า (ก่อนมี navigateFallbackDenylist กัน path
         พวกนี้ไว้ — ดู vite.config.js) ยังคุมเบราว์เซอร์อยู่ แล้วแย่ง fallback ไปเสิร์ฟ
         index.html นี้แทนของจริง (จอขาว) — deploy ใหม่แก้ที่ vite.config.js อย่างเดียวช่วย
         ไม่ได้ เพราะ SW เวอร์ชันเก่าที่ยังไม่ activate เวอร์ชันใหม่จะยังคุมอยู่ต่อไปอีก
         พักหนึ่ง ต้องมีสคริปต์กู้ตัวเองฝั่งนี้ (หน้าที่โดนยึดจริง) ล้าง SW เก่าทิ้งแล้วโหลด
         ใหม่หนึ่งครั้งให้ได้หน้าจริงจาก network ตรง ๆ ทันที ไม่ต้องรอ SW อัปเดตเอง (กัน
         loop ด้วย flag ครั้งเดียวต่อ tab) ต้องอยู่ก่อน main.jsx เพื่อดักได้ก่อนแอปเริ่ม mount -->
    <script>
      (function () {
        var p = window.location.pathname;
        var isForeignPage = p === '/champ-power-landing.html' || p.indexOf('/landing') === 0;
        if (!isForeignPage) return;
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        if (sessionStorage.getItem('__swRescueDone')) return;
        sessionStorage.setItem('__swRescueDone', '1');
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          window.location.replace(window.location.href);
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
